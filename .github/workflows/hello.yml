name: Hello

on:
  workflow_call:
    outputs:
      greeting:
        value: ${{ jobs.say.outputs.greeting1 }}
jobs:
  say:
    runs-on: ubuntu-latest
    outputs:
      greeting1: ${{ steps.msg2.outputs.text }}
    steps:
      - id: msg2
        run: echo "text=hello ahmed " >> $GITHUB_OUTPUT
  
