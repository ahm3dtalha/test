name: Hello

on:
  workflow_call:
    outputs:
      greeting:
        value: ${{ jobs.say.outputs.greeting }}
      get:
        value: ${{ jobs.say2.outputs.get }}

jobs:
  say:
    runs-on: ubuntu-latest
    outputs:
      greeting: ${{ steps.msg.outputs.text }}
    steps:
      - id: msg
        run: echo "text=hello" >> $GITHUB_OUTPUT
      
  say2:
    runs-on: ubuntu-latest
    outputs:
      get: ${{ steps.msg2.outputs.text }}
    steps:
      - id: msg2
        run: echo "text=hi" >> $GITHUB
      - run: echo "sahmed" >> $git
