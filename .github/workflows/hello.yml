name: Hello

on:
  workflow_call:
    outputs:
      greeting:
        value: ${{ jobs.say.outputs.greeting1 }}
      getting:
        value: ${{ jobs.say.outputs.getting }}
jobs:
  say:
    runs-on: ubuntu-latest
    outputs:
      greeting1: ${{ steps.msg2.outputs.text }}
      getting: ${ steps.msg2.output.text }}
    steps:
      - id: msg2
        run: |
          echo "text=hello ahmed " >> $GITHUB_OUTPUT
          echo "hi ahmed" >>  $GITHUB_OUTPUT
        
  
