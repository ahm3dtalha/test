name: Sender Workflow

on:
  push:

jobs:
  produce_data:
    runs-on: ubuntu-latest
    outputs:
      my_words: ${{ steps.set_values.outputs.hello }}
      my_name: ${{ steps.set_values.outputs.name }}
    
    steps:
      - name: Set multiple values
        id: set_values
        run: |
          echo "hello=hi" >> $GITHUB_OUTPUT
          echo "name=ahmed" >> $GITHUB_OUTPUT

  # استدعاء الـ Workflow الثاني وتمرير القيم إليه
  call_receiver:
    needs: produce_data
    uses: ./.github/workflows/receiver.yml
    with:
      passed_greeting: ${{ needs.produce_data.outputs.my_words }}
      passed_name: ${{ needs.produce_data.outputs.my_name }}
